:root{--ut1:#8ec5ff;--ut2:#c58bff;--ut3:#ffcc4a;--ut4:#fff}

.tile,.eqs{border-radius:8px;border:2px solid #4a4270;background:#191330;overflow:hidden;isolation:isolate}
.tile>*,.eqs>*{position:relative;z-index:2}
.tile .mk,.eqs .mk{position:absolute;z-index:3;font-size:10px;font-weight:900;line-height:1;text-shadow:0 1px 0 #000}
.mk.lk{left:2px;bottom:1px;color:#ffd24a}.mk.pr{left:2px;top:1px;color:#6ad0ff;background:#0b2a40;border-radius:3px;padding:1px 3px}.mk.up{right:2px;top:0;color:#5dff7a}
.tile.sel,.eqs.sel{outline:2px solid #fff;outline-offset:1px}
.tile.dim2{opacity:.35}
/* 고유 등급: 테두리 + 배경 연출 */
.tile[class*=" ut"]::before,.eqs[class*=" ut"]::before,.tile[class^="ut"]::before{content:"";position:absolute;left:-60%;top:-60%;width:220%;height:220%;z-index:0}
.tile[class*=" ut"]::after,.eqs[class*=" ut"]::after{content:"";position:absolute;inset:2px;border-radius:6px;z-index:1}
